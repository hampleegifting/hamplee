<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Hampers — Hamplee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@400;500;600&display=swap"></noscript>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:   #C9A959;
      --dark:   #1A1A1A;
      --cream:  #F8F7F4;
      --white:  #FFFFFF;
      --grey:   #6B6B6B;
      --border: #E8E4DC;
      --serif:  'Cormorant Garamond', Georgia, serif;
      --sans:   'Montserrat', sans-serif;
    }

    html, body { height: 100%; font-family: var(--sans); background: var(--cream); color: var(--dark); overflow: hidden; }

    /* ─── Shell ─────────────────────────────────────────── */
    .shell { display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; }

    /* ─── Shared header / footer ─────────────────────────── */
    .bar {
      background: var(--white);
      flex-shrink: 0;
    }
    .top-bar {
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 0;
    }
    .top-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--grey);
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--border); color: var(--dark); }

    .bar-title {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 300;
      color: var(--dark);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Search */
    .search-wrap { position: relative; flex: 1; max-width: 260px; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #bbb; pointer-events: none; }
    .search-input {
      width: 100%; height: 34px;
      border: 1px solid var(--border); border-radius: 20px;
      padding: 0 12px 0 32px;
      font-family: var(--sans); font-size: 12px; color: var(--dark);
      background: var(--cream); outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: #bbb; }
    .search-input:focus { border-color: var(--gold); background: var(--white); }

    /* Category pills */
    .pills {
      display: flex; gap: 7px; overflow-x: auto;
      padding-bottom: 14px; scrollbar-width: none;
    }
    .pills::-webkit-scrollbar { display: none; }
    .pill {
      height: 26px; padding: 0 13px;
      border-radius: 20px; border: 1px solid var(--border);
      background: var(--white);
      font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--grey);
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: all 0.15s;
    }
    .pill:hover { border-color: var(--gold); color: var(--dark); }
    .pill.active { background: var(--dark); border-color: var(--dark); color: var(--white); }

    /* Footer */
    .bot-bar {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .bot-label { font-size: 12px; color: var(--grey); }
    .bot-label strong { font-size: 14px; font-weight: 600; color: var(--dark); margin-right: 3px; }
    .confirm-btn {
      height: 38px; padding: 0 24px;
      background: var(--gold); color: var(--white);
      border: none; border-radius: 40px;
      font-family: var(--sans); font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
    }
    .confirm-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ─── Grid view ──────────────────────────────────────── */
    .grid-scroll {
      flex: 1; overflow-y: auto; padding: 14px;
    }
    .hamper-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    /* Card */
    .h-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .h-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); border-color: #ccc; }
    .h-card.has-selection { border-color: var(--gold); }

    .h-card-img-wrap { position: relative; aspect-ratio: 4/3; overflow: hidden; background: var(--cream); }
    .h-card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
    .h-card:hover .h-card-img { transform: scale(1.04); }

    /* Selection indicator badge on card */
    .h-card-badge {
      position: absolute; top: 7px; right: 7px;
      min-width: 22px; height: 22px; padding: 0 6px;
      border-radius: 20px;
      background: var(--gold); color: var(--white);
      font-size: 10px; font-weight: 700;
      display: none; align-items: center; justify-content: center;
      white-space: nowrap;
    }
    .h-card.has-selection .h-card-badge { display: flex; }

    /* Arrow hint */
    .h-card-arrow {
      position: absolute; bottom: 7px; right: 7px;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
    }

    .h-card-info { padding: 9px 11px 11px; }
    .h-card-cat { font-size: 9px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; }
    .h-card-name { font-family: var(--serif); font-size: 14px; color: var(--dark); line-height: 1.25; }

    .empty-msg { grid-column: 1/-1; text-align: center; padding: 48px 20px; font-size: 13px; color: var(--grey); line-height: 1.7; }

    /* ─── Detail view ────────────────────────────────────── */
    .detail-view {
      position: absolute; inset: 0;
      background: var(--cream);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
      z-index: 10;
    }
    .detail-view.open { transform: translateX(0); }

    .detail-top {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    .detail-top-title {
      font-family: var(--serif);
      font-size: 18px; font-weight: 300;
      color: var(--dark); flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .detail-scroll { flex: 1; overflow-y: auto; }

    /* Hero image */
    .detail-hero {
      width: 100%; aspect-ratio: 16/7;
      object-fit: cover; display: block;
      background: var(--cream);
    }

    .detail-body { padding: 20px 16px 0; }

    .detail-cat { font-size: 9px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
    .detail-name { font-family: var(--serif); font-size: 26px; font-weight: 300; color: var(--dark); line-height: 1.2; margin-bottom: 6px; }
    .detail-tagline { font-size: 13px; color: var(--grey); line-height: 1.6; margin-bottom: 20px; }

    /* Add whole hamper row */
    .whole-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 20px;
      gap: 12px;
    }
    .whole-row:hover { border-color: #ccc; }
    .whole-row.selected { border-color: var(--gold); background: #FFFDF7; }

    .whole-row-text { flex: 1; }
    .whole-row-label { font-size: 13px; font-weight: 600; color: var(--dark); margin-bottom: 2px; }
    .whole-row-hint { font-size: 11px; color: var(--grey); }

    .whole-check {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.18s;
      background: var(--white);
    }
    .whole-row.selected .whole-check { background: var(--gold); border-color: var(--gold); }
    .whole-check-icon { display: none; }
    .whole-row.selected .whole-check-icon { display: block; }

    /* Section divider */
    .section-label {
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--grey);
      margin-bottom: 10px;
    }

    /* Item rows */
    .items-list { display: flex; flex-direction: column; gap: 1px; margin-bottom: 20px; }
    .no-items-msg { font-size: 13px; color: var(--grey); padding: 12px 0; }

    .item-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px;
      background: var(--white);
      cursor: pointer;
      transition: background 0.15s;
      border-radius: 0;
    }
    .item-row:first-child { border-radius: 10px 10px 0 0; }
    .item-row:last-child  { border-radius: 0 0 10px 10px; }
    .item-row:only-child  { border-radius: 10px; }
    .item-row:hover { background: #FFFDF7; }
    .item-row.checked { background: #FFFBF0; }

    .item-check {
      width: 20px; height: 20px; border-radius: 4px;
      border: 1.5px solid var(--border);
      background: var(--white);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
      transition: all 0.15s;
    }
    .item-row.checked .item-check { background: var(--gold); border-color: var(--gold); }
    .item-check-icon { display: none; }
    .item-row.checked .item-check-icon { display: block; }

    .item-text { flex: 1; min-width: 0; }
    .item-name { font-size: 13px; font-weight: 500; color: var(--dark); margin-bottom: 2px; }
    .item-desc { font-size: 11px; color: var(--grey); line-height: 1.5; }
    /* Bottom padding inside scroll */
    .detail-scroll-pad { height: 20px; }

    /* ─── Responsive ─────────────────────────────────────── */
    @media (max-width: 480px) {
      .bar-title { font-size: 16px; }
      .search-wrap { max-width: none; }
      .hamper-grid { gap: 8px; }
      .grid-scroll { padding: 10px; }
      .detail-name { font-size: 22px; }
      .detail-hero { aspect-ratio: 4/3; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- ── Grid view ───────────────────────────────────── -->
  <div class="top-bar bar" id="gridTopBar">
    <div class="top-bar-row">
      <span class="bar-title">Select Hampers</span>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Search…" oninput="applyFilters()">
      </div>
      <button class="icon-btn" onclick="cancelAndClose()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="pills" id="pillsRow">
      <button class="pill active" data-cat="all" onclick="setCat('all')">All</button>
    </div>
  </div>

  <div class="grid-scroll" id="gridScroll">
    <div class="hamper-grid" id="hamperGrid"></div>
  </div>

  <div class="bot-bar bar" id="gridBotBar">
    <span class="bot-label" id="footerLabel"><strong>0</strong> added</span>
    <button class="confirm-btn" id="confirmBtn" onclick="confirmAndClose()" disabled>Add to Mood Board</button>
  </div>

  <!-- ── Detail view ─────────────────────────────────── -->
  <div class="detail-view" id="detailView">

    <div class="detail-top bar">
      <button class="icon-btn" onclick="closeDetail()" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="detail-top-title" id="detailTopTitle"></span>
    </div>

    <div class="detail-scroll" id="detailScroll">
      <img class="detail-hero" id="detailHero" src="" alt="">

      <div class="detail-body">
        <div class="detail-cat"  id="detailCat"></div>
        <div class="detail-name" id="detailName"></div>
        <div class="detail-tagline" id="detailTagline"></div>

        <!-- Select whole hamper -->
        <div class="whole-row" id="wholeRow" onclick="toggleWholeHamper()">
          <div class="whole-row-text">
            <div class="whole-row-label">Add entire hamper</div>
            <div class="whole-row-hint">Include this complete hamper in your mood board</div>
          </div>
          <div class="whole-check" id="wholeCheck">
            <svg class="whole-check-icon" viewBox="0 0 12 10" fill="none" width="11" height="9">
              <polyline points="1,5 4.5,8.5 11,1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <!-- Individual items -->
        <div id="itemsSection">
          <div class="section-label" id="itemsLabel"></div>
          <div class="items-list" id="itemsList"></div>
        </div>

        <div class="detail-scroll-pad"></div>
      </div>
    </div>

    <div class="bot-bar bar">
      <span class="bot-label" id="detailFooterLabel"><strong>0</strong> added</span>
      <button class="confirm-btn" id="detailConfirmBtn" onclick="confirmAndClose()" disabled>Add to Mood Board</button>
    </div>

  </div><!-- /detail-view -->
</div><!-- /shell -->

<script src="data/hampers-data.js"></script>
<script>
// ── State ─────────────────────────────────────────────
let ALL_HAMPERS   = [];
let currentCat    = 'all';
let currentSearch = '';
let activeHamper  = null;   // hamper object currently shown in detail

// SELECTION is a flat Map keyed by a unique string:
//   whole hamper  → key = "H:festive-004"
//   individual item → key = "I:festive-004:2"
const SELECTION = new Map();

// ── Boot ──────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const data = window.HAMPLEE_DATA;
  if (!data || !data.hampers) {
    document.getElementById('hamperGrid').innerHTML =
      '<p class="empty-msg">Unable to load hampers. Please close and try again.</p>';
    return;
  }
  ALL_HAMPERS = data.hampers;

  const cats = [...new Set(ALL_HAMPERS.map(h => h.category))];
  const row  = document.getElementById('pillsRow');
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.dataset.cat = c;
    btn.textContent = c;
    btn.onclick = () => setCat(c);
    row.appendChild(btn);
  });

  renderGrid();
});

// ── Filters ───────────────────────────────────────────
function setCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.pill').forEach(p =>
    p.classList.toggle('active', p.dataset.cat === cat)
  );
  renderGrid();
}

function applyFilters() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase().trim();
  renderGrid();
}

function getFiltered() {
  return ALL_HAMPERS.filter(h => {
    if (currentCat !== 'all' && h.category !== currentCat) return false;
    if (!currentSearch) return true;
    return (
      h.name.toLowerCase().includes(currentSearch) ||
      h.category.toLowerCase().includes(currentSearch) ||
      (h.tagline || '').toLowerCase().includes(currentSearch)
    );
  });
}

// ── Grid render ───────────────────────────────────────
function renderGrid() {
  const hampers = getFiltered();
  const grid    = document.getElementById('hamperGrid');

  if (!hampers.length) {
    grid.innerHTML = '<p class="empty-msg">No hampers match your search.</p>';
    return;
  }

  grid.innerHTML = hampers.map(h => {
    const count        = selectionCountFor(h.id);
    const hasSel       = count > 0;
    const thumb        = h.image.replace(/\.(png|jpe?g)$/i, '-600.jpg');
    const label        = count === 1 && SELECTION.has('H:' + h.id)
      ? 'Entire hamper'
      : count > 0 ? `${count} item${count > 1 ? 's' : ''}` : '';

    return `
      <div class="h-card${hasSel ? ' has-selection' : ''}"
           onclick="openDetail('${h.id}')" role="button" tabindex="0">
        <div class="h-card-img-wrap">
          <img class="h-card-img" src="${thumb}" alt="${h.name}"
               onerror="this.onerror=null;this.src='${h.image}'" loading="lazy" decoding="async">
          <div class="h-card-badge">${label}</div>
          <div class="h-card-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" width="11" height="11" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
        <div class="h-card-info">
          <div class="h-card-cat">${h.category}</div>
          <div class="h-card-name">${h.name}</div>
        </div>
      </div>`;
  }).join('');
}

function selectionCountFor(hid) {
  // Count whole-hamper + individual items selected for this hamper
  let n = 0;
  if (SELECTION.has('H:' + hid)) n++;
  SELECTION.forEach((_, k) => { if (k.startsWith('I:' + hid + ':')) n++; });
  return n;
}

// ── Detail view ───────────────────────────────────────
function openDetail(hid) {
  activeHamper = ALL_HAMPERS.find(h => h.id === hid);
  if (!activeHamper) return;
  const h = activeHamper;

  // Populate header
  document.getElementById('detailTopTitle').textContent = h.name;
  document.getElementById('detailCat').textContent      = h.category;
  document.getElementById('detailName').textContent     = h.name;
  document.getElementById('detailTagline').textContent  = h.tagline || h.description || '';

  // Hero image — use 1200w for quality
  const heroImg = document.getElementById('detailHero');
  heroImg.src   = h.image.replace(/\.(png|jpe?g)$/i, '-1200.jpg');
  heroImg.alt   = h.name;
  heroImg.onerror = () => { heroImg.onerror = null; heroImg.src = h.image; };

  // Whole-hamper row state
  refreshWholeRow();

  // Items list
  const items = h.items || [];
  const itemsSection = document.getElementById('itemsSection');

  if (items.length) {
    document.getElementById('itemsLabel').textContent =
      items.length === 1 ? '1 item in this hamper' : `${items.length} items in this hamper`;

    document.getElementById('itemsList').innerHTML = items.map((it, idx) => {
      const key     = 'I:' + h.id + ':' + idx;
      const checked = SELECTION.has(key);
      return `
        <div class="item-row${checked ? ' checked' : ''}" onclick="toggleItem('${h.id}', ${idx})">
          <div class="item-check">
            <svg class="item-check-icon" viewBox="0 0 12 10" fill="none" width="10" height="8">
              <polyline points="1,5 4.5,8.5 11,1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="item-text">
            <div class="item-name">${it.name}</div>
            ${it.description ? `<div class="item-desc">${it.description}</div>` : ''}
          </div>
        </div>`;
    }).join('');
    itemsSection.style.display = '';
  } else {
    itemsSection.style.display = 'none';
  }

  // Reset detail scroll position
  document.getElementById('detailScroll').scrollTop = 0;

  // Slide in
  document.getElementById('detailView').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('open');
  activeHamper = null;
  renderGrid();       // refresh card badges
}

// ── Selection logic ───────────────────────────────────
function toggleWholeHamper() {
  if (!activeHamper) return;
  const key = 'H:' + activeHamper.id;
  if (SELECTION.has(key)) {
    SELECTION.delete(key);
  } else {
    SELECTION.set(key, { id: activeHamper.id, name: activeHamper.name, category: activeHamper.category });
  }
  refreshWholeRow();
  refreshCounts();
  sendToParent();
}

function refreshWholeRow() {
  if (!activeHamper) return;
  const selected = SELECTION.has('H:' + activeHamper.id);
  document.getElementById('wholeRow').classList.toggle('selected', selected);
}

function toggleItem(hid, idx) {
  const h   = ALL_HAMPERS.find(x => x.id === hid);
  if (!h) return;
  const it  = (h.items || [])[idx];
  if (!it) return;
  const key = 'I:' + hid + ':' + idx;

  if (SELECTION.has(key)) {
    SELECTION.delete(key);
  } else {
    SELECTION.set(key, { id: key, name: it.name, category: h.name });
  }

  // Re-render just the item row in place
  const rows = document.querySelectorAll('#itemsList .item-row');
  if (rows[idx]) rows[idx].classList.toggle('checked', SELECTION.has(key));

  refreshCounts();
  sendToParent();
}

// ── Counts & footer ───────────────────────────────────
function refreshCounts() {
  const n = SELECTION.size;
  const label = n === 0 ? '<strong>0</strong> added'
    : `<strong>${n}</strong> ${n === 1 ? 'item' : 'items'} added`;

  document.getElementById('footerLabel').innerHTML       = label;
  document.getElementById('detailFooterLabel').innerHTML = label;
  document.getElementById('confirmBtn').disabled       = n === 0;
  document.getElementById('detailConfirmBtn').disabled = n === 0;
}

// ── Parent communication ──────────────────────────────
function buildProducts() {
  return [...SELECTION.values()];
}

function sendToParent() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'productSelection', products: buildProducts() }, '*');
  }
}

function confirmAndClose() {
  if (SELECTION.size === 0) return;
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'confirmAndClose', products: buildProducts() }, '*');
  }
}

function cancelAndClose() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'confirmAndClose', products: buildProducts() }, '*');
  }
}

// ── Sync from parent (tag removed in mood board) ─────
window.addEventListener('message', e => {
  if (e.data.type !== 'syncSelection') return;

  // Rebuild SELECTION from parent's authoritative list.
  // Whole-hamper products have id = "festive-004" but the SELECTION map
  // keys them as "H:festive-004". Individual items already carry "I:" prefix.
  SELECTION.clear();
  (e.data.products || []).forEach(p => {
    const key = p.id.startsWith('I:') ? p.id : 'H:' + p.id;
    SELECTION.set(key, p);
  });

  // Refresh grid badges
  renderGrid();

  // If detail panel is open, refresh its state in place
  if (activeHamper && document.getElementById('detailView').classList.contains('open')) {
    refreshWholeRow();
    document.querySelectorAll('#itemsList .item-row').forEach((row, idx) => {
      const key = 'I:' + activeHamper.id + ':' + idx;
      row.classList.toggle('checked', SELECTION.has(key));
    });
  }

  refreshCounts();
});

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('detailView').classList.contains('open')) closeDetail();
    else cancelAndClose();
  }
});
</script>
</body>
